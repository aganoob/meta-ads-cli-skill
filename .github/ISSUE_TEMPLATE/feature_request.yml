name: Feature request
description: Suggest an improvement to the skill or repository harness.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or safety gap should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired behavior or documentation update.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Do not include tokens, secrets, private account IDs, or private performance data.
